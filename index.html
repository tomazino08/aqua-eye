<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Aqua-Eye</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#5c5c61;--line:#e5e5ea;--accent:#0066cc;--on-accent:#fff;--alert:#c4281c;--shadow:0 2px 12px rgba(0,0,0,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0d;--card:#1c1c1e;--text:#f5f5f7;--muted:#a1a1a6;--line:#2c2c2e;--accent:#4da3ff;--on-accent:#001a33;--alert:#ff7a70;--shadow:0 2px 12px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.4 -apple-system,"SF Pro Text",Roboto,system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:24px 20px 48px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:32px}
.brand svg{width:24px;height:24px;fill:var(--accent)}
h1{font-size:28px;font-weight:600;line-height:1.2;margin:0 0 8px}
h2{font-size:17px;font-weight:600;margin:40px 0 8px}
.hint,.meta{font-size:16px;color:var(--muted)}
.hint{margin:0 0 16px}
.consigne{margin:8px 0 0}
.field{position:relative}
textarea{display:block;width:100%;min-height:160px;padding:16px 16px 72px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);font:inherit;resize:none;box-shadow:var(--shadow);transition:border-color .2s}
textarea:focus{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;cursor:pointer;transition:transform .15s,opacity .15s,background-color .15s}
button:active{transform:scale(.98)}
.mic{position:absolute;right:12px;bottom:12px;width:48px;height:48px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--accent);display:grid;place-items:center}
.mic svg{width:24px;height:24px;fill:currentColor}
.mic:active{transform:scale(.94)}
.mic.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mic.on::after{content:"";position:absolute;inset:-4px;border:2px solid var(--accent);border-radius:50%;animation:listen 1.3s ease-out infinite}
.mic.busy{opacity:.7;pointer-events:none}
.mic.busy::after{content:"";position:absolute;inset:-3px;border:2px solid transparent;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes listen{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--accent)}
.photo-btn svg{width:24px;height:24px;fill:currentColor}
.apercu{display:flex;align-items:center;gap:12px;margin-top:12px}
.apercu img{width:64px;height:64px;object-fit:cover;border-radius:12px;box-shadow:var(--shadow);animation:pop .3s ease-out}
.primary{display:block;width:100%;min-height:52px;margin-top:16px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent)}
.primary:disabled{opacity:.6;cursor:default}
.ghost{display:block;width:100%;min-height:52px;margin-top:16px;border:0;border-radius:14px;background:transparent;color:var(--accent)}
.link{min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--accent)}
#msg{min-height:24px;margin:12px 0 0;font-size:16px;color:var(--alert)}
#msg.info{color:var(--muted)}
.card{background:var(--card);border-radius:16px;padding:24px 20px;box-shadow:var(--shadow)}
.drop{position:relative;width:64px;height:64px;margin:0 auto 16px;display:grid;place-items:center}
.drop svg{width:32px;height:32px;fill:var(--accent);z-index:1;animation:pop .3s ease-out}
.drop::before,.drop::after{content:"";position:absolute;inset:0;border:2px solid var(--accent);border-radius:50%;opacity:0;animation:ring 1.2s ease-out 1}
.drop::after{animation-delay:.25s}
@keyframes ring{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.4);opacity:0}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.done-title{text-align:center;font-weight:600;margin:0 0 16px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.row span:first-child{font-size:16px;color:var(--muted)}
.row span:last-child{text-align:right;word-break:break-word}
.note{font-size:16px;color:var(--muted);margin:16px 0 0}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:16px;margin-bottom:8px;box-shadow:var(--shadow);word-break:break-word}
.item .txt{flex:1;min-width:0}
.item strong{display:block;font-weight:600}
.item .thumb{width:56px;height:56px;flex:none;object-fit:cover;border-radius:10px}
.high{color:var(--alert);font-weight:600}
.sk{height:72px;border-radius:12px;background:var(--line);margin-bottom:8px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <main>
<div class="brand">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-3.6 4.4-6 7.6-6 11a6 6 0 0 0 12 0c0-3.4-2.4-6.6-6-11z"/></svg>
<span>Aqua-Eye</span>
</div>

<section id="form">
<h1>Que se passe-t-il ?</h1>
<p class="hint">Écrivez ou dictez. Vérifiez le texte avant d'envoyer.</p>
<label for="texte" hidden>Votre signalement</label>
<div class="field">
<textarea id="texte" maxlength="1000" placeholder="Ex. : La pompe du quartier Godomey est en panne depuis 3 jours."></textarea>
<button id="mic" class="mic" type="button" aria-label="Dicter le signalement" hidden>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
</button>
</div>

<input id="photo" type="file" accept="image/*" hidden>
<button id="ajoutPhoto" class="photo-btn" type="button">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
<span id="ajoutLabel">Ajouter une photo</span>
</button>
<div id="apercu" class="apercu" hidden>
<img id="apercuImg" alt="Aperçu de la photo jointe">
<button id="retirer" class="link" type="button">Retirer</button>
</div>
<p class="meta consigne">Photographiez le point d'eau, pas de personnes.</p>

<button id="envoyer" class="primary">Envoyer</button>
<p id="msg" role="status" aria-live="polite"></p>
</section>

<section id="done" hidden>
<div class="card">
<div class="drop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-3.6 4.4-6 7.6-6 11a6 6 0 0 0 12 0c0-3.4-2.4-6.6-6-11z"/></svg></div>
<p class="done-title">Signalement envoyé</p>
<div class="row"><span>Problème</span><span id="r-type"></span></div>
<div class="row"><span>Urgence</span><span id="r-urg"></span></div>
<div class="row"><span>Point d'eau</span><span id="r-lieu"></span></div>
<div class="row" id="r-photo-row" hidden><span>Photo</span><span>Jointe</span></div>
<p class="note" id="r-note" hidden></p>
</div>
<button id="nouveau" class="ghost">Nouveau signalement</button>
</section>

<h2>Derniers signalements</h2>
<div id="liste"></div>
</main>
<script>
const PROJ = "https://vvnqfvpswughneqjyvhw.supabase.co";
const BASE = PROJ + "/rest/v1/signalements";
const PHOTO_PUB = PROJ + "/storage/v1/object/public/photos/";
const KEY = "sb_publishable_TqMSG-00c_6l28P3qVMlOA_dQiAuaxP";
const HEAD = { "apikey": KEY, "Content-Type": "application/json" };
const $ = function (id) { return document.getElementById(id); };

function setMsg(t, info) {
  const m = $("msg");
  m.textContent = t || "";
  m.className = info ? "info" : "";
}

function pause(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function analyser(texte) {
  for (let i = 0; i < 3; i++) {
    try {
      const r = await fetch("/api/analyse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texte: texte })
      });
      if (r.ok) return await r.json();
    } catch (e) {}
    await pause(800 * (i + 1));
  }
  return null;
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; }

/* ---------- Photo (réduction 1024 px, JPEG, EXIF effacé) ---------- */
let photo = null, apercuUrl = null;

function chargerImage(file) {
  return new Promise(function (ok, ko) {
    const u = URL.createObjectURL(file);
    const im = new Image();
    im.onload = function () { URL.revokeObjectURL(u); ok(im); };
    im.onerror = function () { URL.revokeObjectURL(u); ko(new Error("image")); };
    im.src = u;
  });
}

async function reduire(file) {
  const im = await chargerImage(file);
  const k = Math.min(1, 1024 / Math.max(im.naturalWidth, im.naturalHeight));
  const w = Math.max(1, Math.round(im.naturalWidth * k));
  const h = Math.max(1, Math.round(im.naturalHeight * k));
  const c = document.createElement("canvas");
  c.width = w;
  c.height = h;
  c.getContext("2d").drawImage(im, 0, 0, w, h);
  for (let q = 0.8; q > 0.35; q -= 0.1) {
    const b = await new Promise(function (r) { c.toBlob(r, "image/jpeg", q); });
    if (b && b.size <= 900000) return b;
  }
  throw new Error("trop lourde");
}

function retirerPhoto() {
  photo = null;
  if (apercuUrl) { URL.revokeObjectURL(apercuUrl); apercuUrl = null; }
  $("apercuImg").removeAttribute("src");
  $("apercu").hidden = true;
  $("ajoutLabel").textContent = "Ajouter une photo";
}

$("ajoutPhoto").onclick = function () { $("photo").click(); };
$("retirer").onclick = function () { retirerPhoto(); setMsg(""); };

$("photo").onchange = async function () {
  const f = this.files && this.files[0];
  this.value = "";
  if (!f) return;
  if (!/^image\//.test(f.type)) { setMsg("Choisissez une image."); return; }
  setMsg("Préparation de la photo…", true);
  try {
    const b = await reduire(f);
    retirerPhoto();
    photo = b;
    apercuUrl = URL.createObjectURL(b);
    $("apercuImg").src = apercuUrl;
    $("apercu").hidden = false;
    $("ajoutLabel").textContent = "Changer la photo";
    setMsg("");
  } catch (e) {
    setMsg("Photo illisible. Essayez-en une autre.");
  }
};

async function envoyerPhoto(blob) {
  const id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
  const nom = id + ".jpg";
  const r = await fetch(PROJ + "/storage/v1/object/photos/" + nom, {
    method: "POST",
    headers: { "apikey": KEY, "Content-Type": "image/jpeg" },
    body: blob
  });
  if (!r.ok) throw new Error(r.status);
  return PHOTO_PUB + nom;
}

/* ---------- Dictée vocale (enregistrement + transcription Whisper) ---------- */
const mic = $("mic");
const PEUT = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
let enr = null, flux = null, morceaux = [], minuteur = null, etat = "repos";

function etatMic(e) {
  etat = e;
  mic.classList.toggle("on", e === "ecoute");
  mic.classList.toggle("busy", e === "transcription");
  mic.setAttribute("aria-label", e === "ecoute" ? "Arrêter la dictée" : "Dicter le signalement");
}

function typeAudio() {
  const c = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  for (let i = 0; i < c.length; i++) { if (MediaRecorder.isTypeSupported(c[i])) return c[i]; }
  return "";
}

function liberer() {
  if (flux) { flux.getTracks().forEach(function (t) { t.stop(); }); flux = null; }
}

function versBase64(blob) {
  return new Promise(function (ok, ko) {
    const r = new FileReader();
    r.onload = function () { ok(String(r.result).split(",")[1] || ""); };
    r.onerror = ko;
    r.readAsDataURL(blob);
  });
}

function arreter() {
  clearTimeout(minuteur);
  if (enr && enr.state === "recording") enr.stop();
}

async function demarrer() {
  setMsg("");
  try {
    flux = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    setMsg("Micro refusé. Autorisez-le dans le navigateur.");
    return;
  }
  const t = typeAudio();
  try {
    enr = t ? new MediaRecorder(flux, { mimeType: t, audioBitsPerSecond: 32000 }) : new MediaRecorder(flux);
  } catch (e) {
    liberer();
    setMsg("Dictée impossible. Écrivez le message.");
    return;
  }
  morceaux = [];
  enr.ondataavailable = function (e) { if (e.data && e.data.size) morceaux.push(e.data); };
  enr.onstop = traiter;
  enr.start();
  etatMic("ecoute");
  setMsg("Je vous écoute… Touchez pour arrêter.", true);
  minuteur = setTimeout(arreter, 30000);
}

async function traiter() {
  liberer();
  const type = (enr && enr.mimeType) || "audio/webm";
  const blob = new Blob(morceaux, { type: type });
  if (blob.size < 1500) { etatMic("repos"); setMsg("Je n'ai rien entendu. Réessayez."); return; }
  etatMic("transcription");
  setMsg("Transcription…", true);
  try {
    const b64 = await versBase64(blob);
    const r = await fetch("/api/transcrire", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ audio: b64, type: type })
    });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (!d.texte) {
      setMsg("Je n'ai rien compris. Réessayez.");
    } else {
      const base = $("texte").value.trim();
      $("texte").value = ((base ? base + " " : "") + d.texte).slice(0, 1000);
      setMsg("");
    }
  } catch (e) {
    setMsg("Transcription indisponible. Écrivez le message.");
  }
  etatMic("repos");
}

if (PEUT) {
  mic.hidden = false;
  mic.onclick = function () {
    if (etat === "ecoute") arreter();
    else if (etat === "repos") demarrer();
  };
}

/* ---------- Liste des signalements ---------- */
async function charger() {
  const liste = $("liste");
  liste.textContent = "";
  for (let i = 0; i < 3; i++) {
    const sk = document.createElement("div");
    sk.className = "sk";
    liste.appendChild(sk);
  }
  try {
    const r = await fetch(BASE + "?select=type,lieu,urgence,photo_url,created_at&order=created_at.desc&limit=5", { headers: HEAD });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    liste.textContent = "";
    if (!data.length) {
      const p = document.createElement("p");
      p.className = "meta";
      p.textContent = "Aucun signalement pour l'instant.";
      liste.appendChild(p);
      return;
    }
    data.forEach(function (s) {
      const d = document.createElement("div");
      d.className = "item";
      const txt = document.createElement("div");
      txt.className = "txt";
      const t = document.createElement("strong");
      t.textContent = s.type + " · " + s.lieu;
      const m = document.createElement("span");
      m.className = "meta";
      if (s.urgence) {
        const u = document.createElement("span");
        u.textContent = "Urgence " + s.urgence;
        if (s.urgence === "haute") u.className = "high";
        m.appendChild(u);
        m.appendChild(document.createTextNode(" · "));
      }
      m.appendChild(document.createTextNode(new Date(s.created_at).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })));
      txt.append(t, m);
      d.appendChild(txt);
      if (typeof s.photo_url === "string" && s.photo_url.indexOf(PHOTO_PUB) === 0) {
        const im = document.createElement("img");
        im.className = "thumb";
        im.loading = "lazy";
        im.alt = "Photo du signalement";
        im.src = s.photo_url;
        d.appendChild(im);
      }
      liste.appendChild(d);
    });
  } catch (e) {
    liste.textContent = "";
    const p = document.createElement("p");
    p.className = "meta";
    p.textContent = "Impossible de charger la liste.";
    const b = document.createElement("button");
    b.className = "link";
    b.textContent = "Réessayer";
    b.onclick = charger;
    liste.append(p, b);
  }
}

/* ---------- Envoi ---------- */
$("envoyer").onclick = async function () {
  if (etat !== "repos") { setMsg("Terminez d'abord la dictée.", true); return; }
  const btn = $("envoyer");
  const texte = $("texte").value.trim();
  if (texte.length < 10) { setMsg("Écrivez au moins une phrase."); return; }
  btn.disabled = true;
  btn.textContent = "Analyse en cours…";
  setMsg("");
  try {
    let photoErr = "";
    const envoiPhoto = photo
      ? envoyerPhoto(photo).catch(function (e) { photoErr = String((e && e.message) || "erreur"); return null; })
      : Promise.resolve(null);
    const a = await analyser(texte);
    const purl = await envoiPhoto;
    const rec = {
      type: a ? a.type : "Autre",
      lieu: a ? a.point_eau : "inconnu",
      description: texte,
      device_id: (function () { try { var k = "aqe_device", v = localStorage.getItem(k); if (!v) { v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2); localStorage.setItem(k, v); } return v; } catch (e) { return null; } })(),
      urgence: a ? a.urgence : null,
      photo_url: purl
    };
    const r = await fetch(BASE, {
      method: "POST",
      headers: Object.assign({ "Prefer": "return=minimal" }, HEAD),
      body: JSON.stringify(rec)
    });
    if (!r.ok) throw new Error(r.status);
    const notes = [];
    if (!a) notes.push("L'analyse automatique n'a pas répondu.");
    if (photo && !purl) notes.push("La photo n'a pas pu être envoyée (code " + photoErr + ").");
    $("r-type").textContent = rec.type;
    $("r-urg").textContent = rec.urgence ? cap(rec.urgence) : "À confirmer";
    $("r-lieu").textContent = rec.lieu;
    $("r-photo-row").hidden = !purl;
    $("r-note").textContent = notes.length ? notes.join(" ") + " Votre message est bien enregistré." : "";
    $("r-note").hidden = !notes.length;
    $("form").hidden = true;
    $("done").hidden = false;
    charger();
  } catch (e) {
    setMsg("Envoi impossible. Vérifiez la connexion, puis réessayez.");
  }
  btn.disabled = false;
  btn.textContent = "Envoyer";
};

$("nouveau").onclick = function () {
  $("texte").value = "";
  retirerPhoto();
  $("done").hidden = true;
  $("form").hidden = false;
  $("texte").focus();
};

charger();
</script>
</body>
</html>
