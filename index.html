<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aqua-Eye</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b3d5c;color:#fff;padding:20px}
.box{max-width:480px;margin:0 auto}
h1{margin:0 0 4px}
.sub{opacity:.85;margin:0 0 20px}
label{display:block;margin:12px 0 4px;font-weight:bold}
select,input,textarea{width:100%;box-sizing:border-box;padding:10px;border:0;border-radius:6px;font-size:1rem}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:6px;background:#1fa2d6;color:#fff;font-size:1.1rem;font-weight:bold}
#msg{margin-top:12px;min-height:1.2em}
.item{background:#14577f;border-radius:6px;padding:10px;margin-top:10px}
.item small{opacity:.75}
</style>
</head>
<body>
<div class="box">
<h1>💧 Aqua-Eye</h1>
<p class="sub">Signaler un problème d'eau</p>

<label for="type">Type de problème</label>
<select id="type">
<option>Panne de pompe</option>
<option>Eau polluée</option>
<option>Fuite</option>
<option>Pénurie d'eau</option>
</select>

<label for="lieu">Lieu</label>
<input id="lieu" maxlength="200" placeholder="Quartier, village...">

<label for="desc">Description</label>
<textarea id="desc" rows="3" maxlength="1000"></textarea>

<button id="envoyer">Envoyer le signalement</button>
<div id="msg"></div>

<h2>Derniers signalements</h2>
<div id="liste"></div>
</div>

<script>
const BASE = "https://vvnqfvpswughneqjyvhw.supabase.co/rest/v1/signalements";
const KEY = "sb_publishable_TqMSG-00c_6l28P3qVMlOA_dQiAuaxP";
const HEAD = { "apikey": KEY, "Content-Type": "application/json" };

const msg = document.getElementById("msg");
const liste = document.getElementById("liste");

async function charger() {
  try {
    const r = await fetch(BASE + "?select=*&order=created_at.desc&limit=10", { headers: HEAD });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    liste.textContent = "";
    data.forEach(function (s) {
      const d = document.createElement("div");
      d.className = "item";
      const t = document.createElement("strong");
      t.textContent = s.type + " — " + s.lieu;
      const p = document.createElement("div");
      p.textContent = s.description || "";
      const h = document.createElement("small");
      h.textContent = new Date(s.created_at).toLocaleString("fr-FR");
      d.append(t, p, h);
      liste.appendChild(d);
    });
  } catch (e) {
    liste.textContent = "Impossible de charger la liste.";
  }
}

document.getElementById("envoyer").onclick = async function () {
  const lieu = document.getElementById("lieu").value.trim();
  if (!lieu) { msg.textContent = "⚠️ Indique le lieu."; return; }
  msg.textContent = "Envoi...";
  try {
    const r = await fetch(BASE, {
      method: "POST",
      headers: Object.assign({ "Prefer": "return=minimal" }, HEAD),
      body: JSON.stringify({
        type: document.getElementById("type").value,
        lieu: lieu,
        description: document.getElementById("desc").value.trim()
      })
    });
    if (!r.ok) throw new Error(r.status);
    msg.textContent = "✅ Signalement enregistré.";
    document.getElementById("lieu").value = "";
    document.getElementById("desc").value = "";
    charger();
  } catch (e) {
    msg.textContent = "❌ Échec de l'envoi.";
  }
};

charger();
</script>
</body>
</html>
